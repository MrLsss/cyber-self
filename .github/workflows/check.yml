name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-model-cache-bge

      - name: Pull the embedding model
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull bge-m3

      - run: pnpm test
      - run: pnpm build

      - name: lib matches src
        run: git diff --exit-code -- lib
